[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipwa"
version = "1.0.0"
description = "100% Free & Open-Source Automated Viral Video Clipping & YouTube Shorts Automation Pipeline."
readme = "README.md"
authors = [{ name = "Clipwa Team" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "google-genai>=2.30.0",
    "faster-whisper>=1.2.0",
    "pysubs2>=1.9.0",
    "opencv-python>=4.10.0",
    "mediapipe>=0.10.0",
    "yt-dlp>=2025.1.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pydantic>=2.10.0",
    "imageio-ffmpeg>=0.5.1",
]

[project.scripts]
clipwa = "clipwa.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clipwa*"]

[tool.setuptools.package-data]
"clipwa" = ["web/templates/*.html", "models/*"]
